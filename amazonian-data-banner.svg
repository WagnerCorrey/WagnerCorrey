  <text x="78" y="216" fill="#B9E4D0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="1.0">Data · Biodiversity · Society</text>
  <text x="78" y="263" fill="#A5C9B8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="0.5">Artificial intelligence for ecological and socioenvironmental research</text>
  <text x="78" y="310" fill="#86B9A6" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2">PARÁ · BRAZILIAN AMAZON</text>
