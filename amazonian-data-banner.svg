<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc" width="1280" height="340" viewBox="0 0 1280 340">
  <title id="title">Wagner Correa Cardoso. Data, Biodiversity and Society.</title>
  <desc id="desc">A minimalist Amazon-inspired digital landscape combining river pathways, leaves and nodes representing ecological data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09241F"/>
      <stop offset="0.58" stop-color="#103E34"/>
      <stop offset="1" stop-color="#0D302B"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74D8BC" stop-opacity="0.05"/>
      <stop offset="0.52" stop-color="#8BD9C9" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#C7E8BD" stop-opacity="0.28"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9ED1B5" opacity="0.13"/>
    </pattern>
    <clipPath id="rightclip"><rect x="830" width="450" height="340"/></clipPath>
  </defs>
  <rect width="1280" height="340" fill="url(#bg)"/>
